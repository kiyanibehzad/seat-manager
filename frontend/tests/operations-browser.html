<!doctype html><html lang="fa" dir="rtl" data-theme="system"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آزمون مستقل پنل‌ها</title><link rel="stylesheet" href="../build/staging/assets/app.css"></head><body>
<aside class="preview-tools"><label>نقش آزمون <select id="test-role"><option value="admin">مدیر کل</option><option value="hr">منابع انسانی</option><option value="operator">اپراتور</option><option value="user">کاربر</option><option value="settings">مدیر تنظیمات بدون گروه مدیرکل</option><option value="reviewer">فقط بررسی ثبت‌نام</option><option value="people">فقط مدیریت افراد</option></select></label><label>صفحه <select id="test-page"><option value="overview">کارهای روزانه</option><option value="users">کاربران</option><option value="registrations">بررسی ثبت‌نام‌ها</option><option value="departments">بخش‌ها</option><option value="seats">سیت‌ها</option><option value="finance">مالی</option><option value="settings">تنظیمات</option><option value="accounts">حساب‌های من</option><option value="requests">درخواست‌های من</option></select></label><label>دادهٔ آزمون <select id="test-state"><option value="normal">عادی</option><option value="empty">خالی</option><option value="error">خطا</option><option value="mail-unavailable">ایمیل · خطای دریافت</option><option value="mail-conflict">ایمیل · تعارض ذخیره</option><option value="mail-field-error">ایمیل · خطای فیلد</option><option value="mail-test-failure">ایمیل · تست ناموفق</option><option value="mail-test-uncertain">ایمیل · نتیجهٔ نامشخص</option><option value="migration">گروه‌ها هنوز آماده نیست</option><option value="stale-group">تعارض ویرایش گروه</option><option value="forbidden">دسترسی ردشده</option><option value="row-error">خطای سطح ردیف</option><option value="bulk-valid">پیش‌نمایش معتبر لیستی</option><option value="stale">درخواست نیازمند بازبینی</option><option value="renewal-eligible">حساب آمادهٔ تمدید</option><option value="renewal">تمدید منتظر تصمیم</option><option value="partial">انتقال نیمه‌تمام</option><option value="partial-capacity">تبدیل ظرفیت نیمه‌تمام</option></select></label><span>آزمون مستقل با دادهٔ آزمایشی؛ هیچ API واقعی یا ایمیلی فراخوانی نمی‌شود.</span><output id="read-routes"></output><output id="last-command" style="max-width:100%;overflow-wrap:anywhere"></output><output id="write-count">۰ ثبت آزمایشی</output><button type="button" id="audit-dates">بررسی تاریخ فرم</button><output id="date-audit"></output></aside>
<div id="app"><header class="app-header"><span class="brand" dir="ltr">OpenAI ACC Manager</span><div class="header-tools"><div id="test-theme"></div></div></header><main id="main-content"><div class="session-container" id="test-panel"></div></main></div>
<script type="module" src="./operations-browser.js"></script></body></html>
